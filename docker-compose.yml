version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: leadgate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to loopback only: Postgres has no auth hardening beyond the
    # (weak-by-default) POSTGRES_PASSWORD, so it must never be reachable
    # from the LAN/internet, only from other containers on the compose
    # network and from tools running on this host (e.g. local psql).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: leadgate-odoo
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      DB_FILTER: ${ODOO_DB:-odoo}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    # Bound to loopback only: this is a local dev/portfolio deployment, so
    # the Odoo admin UI/XML-RPC endpoint should not be reachable from the
    # LAN or internet.
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n
    container_name: leadgate-n8n
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Dubai}
      TZ: ${GENERIC_TIMEZONE:-Asia/Dubai}
    volumes:
      - n8n_data:/home/node/.n8n
    # Bound to loopback only: n8n's first-run owner-account setup is
    # unauthenticated until an owner account is created, so exposing the
    # port to the LAN/internet before that setup completes would let
    # anyone who reaches it first claim the owner account.
    ports:
      - "127.0.0.1:5678:5678"

volumes:
  postgres_data:
  odoo_data:
  n8n_data:
