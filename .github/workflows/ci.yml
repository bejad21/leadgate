name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Engine (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Test
        # The floor sits a few points under the measured engine coverage, so small changes do not fail CI.
        run: pytest --cov=engine --cov-fail-under=91

  dashboard:
    name: Dashboard (lint, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  odoo-module:
    name: Odoo module installs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install leadgate_domain into an empty database
        # The image is the digest docker-compose.yml pins, so CI tests the build the project was tested on.
        # Odoo can log an error and still exit 0, so the step also fails on any ERROR or CRITICAL line.
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/odoo/addons:/mnt/extra-addons:ro" \
            odoo:18.0@sha256:478065867b945579649373aa4cca3b56f7b74daf0522e5fdf85e7d1262e11d39 \
            odoo -d ci -i leadgate_domain --stop-after-init --no-http --without-demo=all 2>&1 | tee odoo-install.log
          if grep -E " (ERROR|CRITICAL) " odoo-install.log; then
            echo "Odoo logged errors while installing leadgate_domain"
            exit 1
          fi
